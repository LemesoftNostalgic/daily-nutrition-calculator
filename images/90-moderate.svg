  <line x1="85" y1="140" x2="115" y2="140" stroke="#5A8BC0" stroke-width="2" opacity="0.3"/>
  <line x1="87" y1="160" x2="113" y2="160" stroke="#5A8BC0" stroke-width="2" opacity="0.3"/>
