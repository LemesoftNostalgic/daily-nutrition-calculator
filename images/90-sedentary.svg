<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="100" cy="45" rx="28" ry="32" fill="#F4C2A0" stroke="#8B4513" stroke-width="1.5"/>
  <!-- Neck (thicker) -->
  <rect x="88" y="74" width="24" height="14" fill="#F4C2A0" stroke="#8B4513" stroke-width="1"/>
  <!-- Torso (larger, rounder) -->
  <path d="M 60 88 Q 56 130 60 180 L 70 220 L 130 220 L 140 180 Q 144 130 140 88 Z" fill="#6B9BD1" stroke="#4A5568" stroke-width="1.5"/>
  <!-- Prominent belly -->
  <ellipse cx="100" cy="160" rx="48" ry="50" fill="#5A8BC0" opacity="0.5"/>
  <!-- Arms (heavier) -->
  <path d="M 60 100 Q 32 125 28 165 Q 26 183 31 190" fill="none" stroke="#F4C2A0" stroke-width="19" stroke-linecap="round"/>
  <path d="M 140 100 Q 168 125 172 165 Q 174 183 169 190" fill="none" stroke="#F4C2A0" stroke-width="19" stroke-linecap="round"/>
  <!-- Hands -->
  <ellipse cx="31" cy="193" rx="8" ry="10" fill="#E8B090"/>
  <ellipse cx="169" cy="193" rx="8" ry="10" fill="#E8B090"/>
  <!-- Pelvis/Hips (wider) -->
  <ellipse cx="100" cy="225" rx="50" ry="22" fill="#4A5568" stroke="#2D3748" stroke-width="1"/>
  <!-- Legs (heavier) -->
  <path d="M 70 225 L 65 300 L 62 350 L 60 370" fill="none" stroke="#2C5282" stroke-width="28" stroke-linecap="round"/>
  <path d="M 130 225 L 135 300 L 138 350 L 140 370" fill="none" stroke="#2C5282" stroke-width="28" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="58" cy="378" rx="20" ry="12" fill="#1A202C"/>
  <ellipse cx="142" cy="378" rx="20" ry="12" fill="#1A202C"/>
  <!-- Facial features -->
  <circle cx="88" cy="42" r="2" fill="#2D3748"/>
  <circle cx="112" cy="42" r="2" fill="#2D3748"/>
  <path d="M 91 56 Q 100 58 109 56" fill="none" stroke="#8B4513" stroke-width="1" stroke-linecap="round"/>
</svg>
