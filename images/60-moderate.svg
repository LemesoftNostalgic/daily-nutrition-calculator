<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="100" cy="45" rx="22" ry="28" fill="#F4C2A0" stroke="#8B4513" stroke-width="1.5"/>
  <!-- Neck -->
  <rect x="92" y="70" width="16" height="12" fill="#F4C2A0" stroke="#8B4513" stroke-width="1"/>
  <!-- Torso (more defined) -->
  <path d="M 72 82 Q 70 115 72 155 L 82 200 L 118 200 L 128 155 Q 130 115 128 82 Z" fill="#6B9BD1" stroke="#4A5568" stroke-width="1.5"/>
  <!-- Chest definition -->
  <path d="M 85 95 Q 100 98 115 95" fill="none" stroke="#5A8BC0" stroke-width="1.5" opacity="0.5"/>
  <!-- Abs hint -->
  <line x1="100" y1="110" x2="100" y2="170" stroke="#5A8BC0" stroke-width="1.5" opacity="0.4"/>
  <line x1="90" y1="130" x2="110" y2="130" stroke="#5A8BC0" stroke-width="1" opacity="0.3"/>
  <!-- Arms (slight muscle) -->
  <path d="M 72 90 Q 48 108 45 143 Q 43 158 48 164" fill="none" stroke="#F4C2A0" stroke-width="12" stroke-linecap="round"/>
  <path d="M 128 90 Q 152 108 155 143 Q 157 158 152 164" fill="none" stroke="#F4C2A0" stroke-width="12" stroke-linecap="round"/>
  <!-- Bicep definition -->
  <ellipse cx="50" cy="120" rx="4" ry="8" fill="#E8B090" opacity="0.4"/>
  <ellipse cx="150" cy="120" rx="4" ry="8" fill="#E8B090" opacity="0.4"/>
  <!-- Hands -->
  <ellipse cx="48" cy="167" rx="6" ry="8" fill="#E8B090"/>
  <ellipse cx="152" cy="167" rx="6" ry="8" fill="#E8B090"/>
  <!-- Pelvis/Hips -->
  <ellipse cx="100" cy="205" rx="36" ry="18" fill="#4A5568" stroke="#2D3748" stroke-width="1"/>
  <!-- Legs (toned) -->
  <path d="M 82 205 L 77 280 L 74 340 L 72 360" fill="none" stroke="#2C5282" stroke-width="17" stroke-linecap="round"/>
  <path d="M 118 205 L 123 280 L 126 340 L 128 360" fill="none" stroke="#2C5282" stroke-width="17" stroke-linecap="round"/>
  <!-- Thigh definition -->
  <ellipse cx="78" cy="240" rx="6" ry="15" fill="#1E4E7A" opacity="0.3"/>
  <ellipse cx="122" cy="240" rx="6" ry="15" fill="#1E4E7A" opacity="0.3"/>
  <!-- Feet -->
  <ellipse cx="70" cy="368" rx="18" ry="10" fill="#1A202C"/>
  <ellipse cx="130" cy="368" rx="18" ry="10" fill="#1A202C"/>
  <!-- Facial features -->
  <circle cx="92" cy="42" r="2" fill="#2D3748"/>
  <circle cx="108" cy="42" r="2" fill="#2D3748"/>
  <path d="M 95 52 Q 100 54 105 52" fill="none" stroke="#8B4513" stroke-width="1" stroke-linecap="round"/>
</svg>
