<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <ellipse cx="100" cy="45" rx="25" ry="30" fill="#F4C2A0" stroke="#8B4513" stroke-width="1.5"/>
  <!-- Neck -->
  <rect x="90" y="72" width="20" height="13" fill="#F4C2A0" stroke="#8B4513" stroke-width="1"/>
  <!-- Torso (rounder) -->
  <path d="M 65 85 Q 62 125 65 170 L 75 210 L 125 210 L 135 170 Q 138 125 135 85 Z" fill="#6B9BD1" stroke="#4A5568" stroke-width="1.5"/>
  <!-- Belly (more prominent) -->
  <ellipse cx="100" cy="155" rx="40" ry="42" fill="#5A8BC0" opacity="0.4"/>
  <!-- Arms (fuller) -->
  <path d="M 65 95 Q 38 118 35 155 Q 33 172 38 178" fill="none" stroke="#F4C2A0" stroke-width="15" stroke-linecap="round"/>
  <path d="M 135 95 Q 162 118 165 155 Q 167 172 162 178" fill="none" stroke="#F4C2A0" stroke-width="15" stroke-linecap="round"/>
  <!-- Hands -->
  <ellipse cx="38" cy="181" rx="7" ry="9" fill="#E8B090"/>
  <ellipse cx="162" cy="181" rx="7" ry="9" fill="#E8B090"/>
  <!-- Pelvis/Hips -->
  <ellipse cx="100" cy="215" rx="45" ry="20" fill="#4A5568" stroke="#2D3748" stroke-width="1"/>
  <!-- Legs (heavier) -->
  <path d="M 75 215 L 70 290 L 67 345 L 65 365" fill="none" stroke="#2C5282" stroke-width="22" stroke-linecap="round"/>
  <path d="M 125 215 L 130 290 L 133 345 L 135 365" fill="none" stroke="#2C5282" stroke-width="22" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="63" cy="373" rx="19" ry="11" fill="#1A202C"/>
  <ellipse cx="137" cy="373" rx="19" ry="11" fill="#1A202C"/>
  <!-- Facial features -->
  <circle cx="90" cy="42" r="2" fill="#2D3748"/>
  <circle cx="110" cy="42" r="2" fill="#2D3748"/>
  <path d="M 93 54 Q 100 56 107 54" fill="none" stroke="#8B4513" stroke-width="1" stroke-linecap="round"/>
</svg>
