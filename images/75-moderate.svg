  <line x1="88" y1="135" x2="112" y2="135" stroke="#5A8BC0" stroke-width="1.5" opacity="0.3"/>
  <line x1="90" y1="155" x2="110" y2="155" stroke="#5A8BC0" stroke-width="1.5" opacity="0.3"/>
