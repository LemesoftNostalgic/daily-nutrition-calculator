  <ellipse cx="42" cy="179" rx="7" ry="9" fill="#E8B090"/>
  <ellipse cx="158" cy="179" rx="7" ry="9" fill="#E8B090"/>
  <!-- Pelvis/Hips -->
  <ellipse cx="100" cy="213" rx="42" ry="20" fill="#4A5568" stroke="#2D3748" stroke-width="1"/>
  <!-- Legs (moderate tone) -->
  <path d="M 78 213 L 73 288 L 70 343 L 68 363" fill="none" stroke="#2C5282" stroke-width="23" stroke-linecap="round"/>
  <path d="M 122 213 L 127 288 L 130 343 L 132 363" fill="none" stroke="#2C5282" stroke-width="23" stroke-linecap="round"/>
  <!-- Thigh definition -->
  <ellipse cx="74" cy="245" rx="7" ry="16" fill="#1E4E7A" opacity="0.4"/>
  <ellipse cx="126" cy="245" rx="7" ry="16" fill="#1E4E7A" opacity="0.4"/>
  <!-- Feet -->
  <ellipse cx="66" cy="371" rx="19" ry="11" fill="#1A202C"/>
  <ellipse cx="134" cy="371" rx="19" ry="11" fill="#1A202C"/>
  <!-- Facial features -->
