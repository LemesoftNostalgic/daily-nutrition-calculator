  <path d="M 67 93 Q 42 115 39 152 Q 37 169 42 176" fill="none" stroke="#F4C2A0" stroke-width="16" stroke-linecap="round"/>
  <path d="M 133 93 Q 158 115 161 152 Q 163 169 158 176" fill="none" stroke="#F4C2A0" stroke-width="16" stroke-linecap="round"/>
  <!-- Bicep definition -->
  <ellipse cx="45" cy="125" rx="5" ry="10" fill="#E8B090" opacity="0.5"/>
  <ellipse cx="155" cy="125" rx="5" ry="10" fill="#E8B090" opacity="0.5"/>
