<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Type Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            margin-bottom: 40px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .btn.active {
            background: #667eea;
            color: white;
        }

        .figure-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .figure-container img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Body Type Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Body Weight (kg)</label>
                <div class="button-group">
                    <button class="btn" data-weight="60">60 kg</button>
                    <button class="btn" data-weight="75">75 kg</button>
                    <button class="btn active" data-weight="90">90 kg</button>
                </div>
            </div>

            <div class="control-group">
                <label>Activity Level</label>
                <div class="button-group">
                    <button class="btn" data-activity="sedentary">Sedentary</button>
                    <button class="btn" data-activity="moderate">Moderate</button>
                    <button class="btn active" data-activity="active">Active</button>
                </div>
            </div>
        </div>

        <div class="figure-container" id="figureContainer">
            <!-- Figure will be inserted here -->
        </div>
    </div>

    <script>
        let currentWeight = '90';
        let currentActivity = 'active';

        function updateFigure() {
            const filename = `images/${currentWeight}-${currentActivity}.svg`;
            const figureContainer = document.getElementById('figureContainer');
            figureContainer.innerHTML = `<img src="${filename}" alt="Body type: ${currentWeight}kg, ${currentActivity}">`;
        }

        // Weight buttons
        document.querySelectorAll('[data-weight]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-weight]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentWeight = this.dataset.weight;
                updateFigure();
            });
        });

        // Activity buttons
        document.querySelectorAll('[data-activity]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-activity]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentActivity = this.dataset.activity;
                updateFigure();
            });
        });

        // Initialize with default figure
        updateFigure();
    </script>
</body>
</html>
