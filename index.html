<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Type Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            margin-bottom: 40px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .btn.active {
            background: #667eea;
            color: white;
        }

        .figure-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Body Type Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Body Weight (kg)</label>
                <div class="button-group">
                    <button class="btn" data-weight="60">60 kg</button>
                    <button class="btn" data-weight="75">75 kg</button>
                    <button class="btn active" data-weight="90">90 kg</button>
                </div>
            </div>

            <div class="control-group">
                <label>Activity Level</label>
                <div class="button-group">
                    <button class="btn" data-activity="sedentary">Sedentary</button>
                    <button class="btn" data-activity="moderate">Moderate</button>
                    <button class="btn active" data-activity="active">Active</button>
                </div>
            </div>
        </div>

        <div class="figure-container" id="figureContainer">
            <!-- Figure will be inserted here -->
        </div>
    </div>

    <script>
        const figures = {

                    <!-- Arms (thin) -->
                    <line x1="65" y1="90" x2="40" y2="140" stroke="#FFD1A9" stroke-width="10" stroke-linecap="round"/>
                    <line x1="135" y1="90" x2="160" y2="140" stroke="#FFD1A9" stroke-width="10" stroke-linecap="round"/>
                    <!-- Legs (thin) -->
                    <line x1="85" y1="175" x2="75" y2="280" stroke="#4A90E2" stroke-width="14" stroke-linecap="round"/>
                    <line x1="115" y1="175" x2="125" y2="280" stroke="#4A90E2" stroke-width="14" stroke-linecap="round"/>
                    <!-- Feet -->
                    <ellipse cx="75" cy="290" rx="15" ry="8" fill="#333"/>
                    <ellipse cx="125" cy="290" rx="15" ry="8" fill="#333"/>
                </svg>
            `,
            '60-moderate': `

                    <!-- Body (slim, moderate tone) -->

                    <!-- Muscle definition lines -->

                    <!-- Legs (moderate) -->
                    <line x1="85" y1="175" x2="75" y2="280" stroke="#4A90E2" stroke-width="16" stroke-linecap="round"/>

            '60-active': `

                    <!-- Head -->

                    <!-- Head -->

                    <!-- Body (medium, moderate tone) -->
                    <ellipse cx="100" cy="125" rx="43" ry="58" fill="#87CEEB" stroke="#333" stroke-width="2"/>
                    <!-- Muscle definition -->
                    <line x1="100" y1="90" x2="100" y2="160" stroke="#6BB6D6" stroke-width="2" opacity="0.4"/>
                    <!-- Arms (toned) -->
                    <line x1="57" y1="95" x2="32" y2="150" stroke="#FFD1A9" stroke-width="15" stroke-linecap="round"/>
                    <line x1="143" y1="95" x2="168" y2="150" stroke="#FFD1A9" stroke-width="15" stroke-linecap="round"/>
                    <!-- Legs (toned) -->
                    <line x1="80" y1="185" x2="70" y2="285" stroke="#4A90E2" stroke-width="21" stroke-linecap="round"/>
                    <line x1="120" y1="185" x2="130" y2="285" stroke="#4A90E2" stroke-width="21" stroke-linecap="round"/>
                    <!-- Feet -->
                    <ellipse cx="70" cy="295" rx="16" ry="9" fill="#333"/>
                    <ellipse cx="130" cy="295" rx="16" ry="9" fill="#333"/>
                </svg>
            `,
            '75-active': `
                <svg width="200" height="350" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="100" cy="40" r="27" fill="#FFD1A9" stroke="#333" stroke-width="2"/>
                    <!-- Body (medium, athletic) -->
                    <ellipse cx="100" cy="125" rx="42" ry="56" fill="#87CEEB" stroke="#333" stroke-width="2"/>
                    <!-- Strong muscle definition -->
                    <line x1="100" y1="85" x2="100" y2="165" stroke="#6BB6D6" stroke-width="2" opacity="0.6"/>
                    <line x1="82" y1="115" x2="118" y2="115" stroke="#6BB6D6" stroke-width="2" opacity="0.5"/>
                    <!-- Arms (athletic) -->
                    <line x1="58" y1="95" x2="33" y2="150" stroke="#FFD1A9" stroke-width="17" stroke-linecap="round"/>
                    <line x1="142" y1="95" x2="167" y2="150" stroke="#FFD1A9" stroke-width="17" stroke-linecap="round"/>
                    <!-- Legs (athletic) -->
                    <line x1="80" y1="185" x2="70" y2="285" stroke="#4A90E2" stroke-width="23" stroke-linecap="round"/>

                    <!-- Feet -->
                    <ellipse cx="70" cy="295" rx="16" ry="9" fill="#333"/>
                    <ellipse cx="130" cy="295" rx="16" ry="9" fill="#333"/>
                </svg>
            `,
            '90-sedentary': `
                <svg width="200" height="350" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="100" cy="40" r="30" fill="#FFD1A9" stroke="#333" stroke-width="2"/>
                    <!-- Body (larger, soft) -->
                    <ellipse cx="100" cy="130" rx="55" ry="65" fill="#87CEEB" stroke="#333" stroke-width="2"/>
                    <!-- Arms (thick) -->
                    <line x1="45" y1="100" x2="20" y2="160" stroke="#FFD1A9" stroke-width="18" stroke-linecap="round"/>
                    <line x1="155" y1="100" x2="180" y2="160" stroke="#FFD1A9" stroke-width="18" stroke-linecap="round"/>
                    <!-- Legs (thick) -->
                    <line x1="75" y1="195" x2="65" y2="290" stroke="#4A90E2" stroke-width="26" stroke-linecap="round"/>
                    <line x1="125" y1="195" x2="135" y2="290" stroke="#4A90E2" stroke-width="26" stroke-linecap="round"/>
                    <!-- Feet -->
                    <ellipse cx="65" cy="300" rx="18" ry="10" fill="#333"/>
                    <ellipse cx="135" cy="300" rx="18" ry="10" fill="#333"/>
                </svg>
            `,
            '90-moderate': `
                <svg width="200" height="350" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="100" cy="40" r="30" fill="#FFD1A9" stroke="#333" stroke-width="2"/>
                    <!-- Body (larger, moderate tone) -->
                    <ellipse cx="100" cy="130" rx="52" ry="63" fill="#87CEEB" stroke="#333" stroke-width="2"/>
                    <!-- Muscle definition -->
                    <line x1="100" y1="90" x2="100" y2="170" stroke="#6BB6D6" stroke-width="2" opacity="0.4"/>

                    <line x1="48" y1="100" x2="23" y2="160" stroke="#FFD1A9" stroke-width="19" stroke-linecap="round"/>
                    <line x1="152" y1="100" x2="177" y2="160" stroke="#FFD1A9" stroke-width="19" stroke-linecap="round"/>
                    <!-- Legs (strong) -->
                    <line x1="75" y1="195" x2="65" y2="290" stroke="#4A90E2" stroke-width="27" stroke-linecap="round"/>
                    <line x1="125" y1="195" x2="135" y2="290" stroke="#4A90E2" stroke-width="27" stroke-linecap="round"/>
                    <!-- Feet -->

            `,
            '90-active': `
                <svg width="200" height="350" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                    <!-- Head -->
                    <circle cx="100" cy="40" r="30" fill="#FFD1A9" stroke="#333" stroke-width="2"/>
                    <!-- Body (larger, very athletic) -->
                    <ellipse cx="100" cy="130" rx="50" ry="60" fill="#87CEEB" stroke="#333" stroke-width="2"/>
                    <!-- Strong muscle definition -->
                    <line x1="100" y1="85" x2="100" y2="175" stroke="#6BB6D6" stroke-width="3" opacity="0.6"/>
                    <line x1="80" y1="120" x2="120" y2="120" stroke="#6BB6D6" stroke-width="2" opacity="0.5"/>
                    <line x1="85" y1="105" x2="115" y2="105" stroke="#6BB6D6" stroke-width="2" opacity="0.5"/>
                    <!-- Arms (very muscular) -->
                    <line x1="50" y1="100" x2="25" y2="160" stroke="#FFD1A9" stroke-width="21" stroke-linecap="round"/>
                    <line x1="150" y1="100" x2="175" y2="160" stroke="#FFD1A9" stroke-width="21" stroke-linecap="round"/>
                    <!-- Legs (very muscular) -->
                    <line x1="75" y1="195" x2="65" y2="290" stroke="#4A90E2" stroke-width="29" stroke-linecap="round"/>
                    <line x1="125" y1="195" x2="135" y2="290" stroke="#4A90E2" stroke-width="29" stroke-linecap="round"/>
                    <!-- Feet -->
                    <ellipse cx="65" cy="300" rx="18" ry="10" fill="#333"/>
                    <ellipse cx="135" cy="300" rx="18" ry="10" fill="#333"/>
                </svg>
            `
        };

        let currentWeight = '90';
        let currentActivity = 'active';

        function updateFigure() {
            const key = `${currentWeight}-${currentActivity}`;
            const figureContainer = document.getElementById('figureContainer');
            figureContainer.innerHTML = figures[key];
        }

        // Weight buttons
        document.querySelectorAll('[data-weight]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-weight]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentWeight = this.dataset.weight;
                updateFigure();
            });
        });

        // Activity buttons
        document.querySelectorAll('[data-activity]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-activity]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentActivity = this.dataset.activity;
                updateFigure();
            });
        });

        // Initialize with default figure
        updateFigure();
    </script>
</body>
</html>
