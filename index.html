<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Type Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .controls {
            margin-bottom: 40px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #f0f0f0;
        }

        .btn.active {
            background: #667eea;
            color: white;
        }

        .content-area {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .figure-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            flex: 0 0 auto;
        }

        .figure-container img {
            max-width: 100px;
            height: auto;
            max-height: 200px;
        }

        .nutrition-info {
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
        }

        .nutrition-info h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .nutrition-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .nutrition-item:last-child {
            border-bottom: none;
        }

        .nutrition-label {
            font-weight: 600;
            color: #555;
            font-size: 16px;
        }

        .nutrition-value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .nutrition-unit {
            font-size: 14px;
            color: #888;
            margin-left: 4px;
        }

        .nutrition-subtext {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .content-area {
                flex-direction: column;
            }
            
            .figure-container,
            .nutrition-info {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Body Type Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Body Weight (kg)</label>
                <div class="button-group">
                    <button class="btn" data-weight="60">60 kg</button>
                    <button class="btn" data-weight="75">75 kg</button>
                    <button class="btn active" data-weight="90">90 kg</button>
                </div>
            </div>

            <div class="control-group">
                <label>Activity Level</label>
                <div class="button-group">
                    <button class="btn" data-activity="sedentary">Sedentary</button>
                    <button class="btn" data-activity="moderate">Moderate</button>
                    <button class="btn active" data-activity="active">Active</button>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="figure-container" id="figureContainer">
                <!-- Figure will be inserted here -->
            </div>

            <div class="nutrition-info">
                <h2>Optimal Daily Nutrition</h2>
                <div class="nutrition-item">
                    <div>
                        <div class="nutrition-label">Carbohydrates</div>
                        <div class="nutrition-subtext">45-65% of calories</div>
                    </div>
                    <div class="nutrition-value">
                        <span id="carbValue">0</span><span class="nutrition-unit">g</span>
                    </div>
                </div>
                <div class="nutrition-item">
                    <div>
                        <div class="nutrition-label">Protein</div>
                        <div class="nutrition-subtext">10-35% of calories</div>
                    </div>
                    <div class="nutrition-value">
                        <span id="proteinValue">0</span><span class="nutrition-unit">g</span>
                    </div>
                </div>
                <div class="nutrition-item">
                    <div>
                        <div class="nutrition-label">Fat</div>
                        <div class="nutrition-subtext">20-35% of calories</div>
                    </div>
                    <div class="nutrition-value">
                        <span id="fatValue">0</span><span class="nutrition-unit">g</span>
                    </div>
                </div>
                <div class="nutrition-item">
                    <div>
                        <div class="nutrition-label">Total Calories</div>
                        <div class="nutrition-subtext">Daily energy intake</div>
                    </div>
                    <div class="nutrition-value">
                        <span id="calorieValue">0</span><span class="nutrition-unit">kcal</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentWeight = '90';
        let currentActivity = 'active';

        // Activity multipliers for calculating TDEE (Total Daily Energy Expenditure)
        const activityMultipliers = {
            'sedentary': 1.2,    // Little or no exercise
            'moderate': 1.55,    // Moderate exercise 3-5 days/week
            'active': 1.725      // Hard exercise 6-7 days/week
        };

        function calculateNutrition(weight, activity) {
            // Calculate BMR using Mifflin-St Jeor Equation (simplified, assuming average height and age)
            // For a gender-neutral average: BMR ≈ 10 × weight(kg) + 6.25 × height(cm) - 5 × age + constant
            // Using average values: height=170cm, age=30, constant=0 (average of +5 for male, -161 for female)
            const bmr = 10 * weight + 6.25 * 170 - 5 * 30;
            
            // Calculate TDEE (Total Daily Energy Expenditure)
            const tdee = Math.round(bmr * activityMultipliers[activity]);
            
            // Calculate macronutrients
            // Carbs: 50% of calories (moderate approach)
            const carbCalories = tdee * 0.50;
            const carbs = Math.round(carbCalories / 4); // 4 calories per gram of carbs
            
            // Protein: varies by activity level
            let proteinPerKg;
            if (activity === 'sedentary') {
                proteinPerKg = 0.8; // RDA for sedentary
            } else if (activity === 'moderate') {
                proteinPerKg = 1.4; // Moderate activity
            } else { // active
                proteinPerKg = 1.8; // Active/athletic
            }
            const protein = Math.round(weight * proteinPerKg);
            
            // Fat: remaining calories after carbs and protein
            const proteinCalories = protein * 4;
            const fatCalories = tdee - carbCalories - proteinCalories;
            const fat = Math.round(fatCalories / 9); // 9 calories per gram of fat
            
            return {
                calories: tdee,
                carbs: carbs,
                protein: protein,
                fat: fat
            };
        }

        function updateNutrition() {
            const weight = parseInt(currentWeight);
            const nutrition = calculateNutrition(weight, currentActivity);
            
            document.getElementById('calorieValue').textContent = nutrition.calories;
            document.getElementById('carbValue').textContent = nutrition.carbs;
            document.getElementById('proteinValue').textContent = nutrition.protein;
            document.getElementById('fatValue').textContent = nutrition.fat;
        }

        function updateFigure() {
            const filename = `images/${currentWeight}-${currentActivity}.svg`;
            const figureContainer = document.getElementById('figureContainer');
            figureContainer.innerHTML = `<img src="${filename}" alt="Body type: ${currentWeight}kg, ${currentActivity}">`;
        }

        function update() {
            updateFigure();
            updateNutrition();
        }

        // Weight buttons
        document.querySelectorAll('[data-weight]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-weight]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentWeight = this.dataset.weight;
                update();
            });
        });

        // Activity buttons
        document.querySelectorAll('[data-activity]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-activity]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentActivity = this.dataset.activity;
                update();
            });
        });

        // Initialize with default figure and nutrition
        update();
    </script>
</body>
</html>
